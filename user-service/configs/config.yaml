app:
  name: ${APP_NAME}
  port: ${PORT}

database:
  host: ${DB_HOST}
  port: ${DB_PORT}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  name: ${DB_NAME}
  sslmode: ${DB_SSLMODE}

kafka:
  brokers: ${KAFKA_BROKERS}
  topic_user_created: ${KAFKA_TOPIC_USER_CREATED}

jwt:
  secret: ${JWT_SECRET}
  expire_hours: ${JWT_EXPIRE_HOURS}