version: "3.9"

services:

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8080:8080"
    volumes:
      - ./user-service/configs:/app/configs
    env_file:               
      - ./user-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: always


  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    ports:
      - "8081:8081"
    volumes:
      - ./booking-service/configs:/app/configs
    env_file:              
      - ./booking-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: always


  ticket-service:
    build:
      context: ./ticket-service
      dockerfile: Dockerfile
    container_name: ticket-service
    ports:
      - "8082:8082"
    volumes:
      - ./ticket-service/configs:/app/configs
    env_file:              
      - ./ticket-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


  postgres:
    image: postgres:15
    container_name: ticker-booking-system-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123!
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata: