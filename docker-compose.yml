  #   depends_on:
  #     kafka:
  #       condition: service_started
  #     postgres:
  #       condition: service_healthy
  #   restart: always


  postgres:
    image: postgres:15
    container_name: booking-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123!
      POSTGRES_DB: booking
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d booking"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always


