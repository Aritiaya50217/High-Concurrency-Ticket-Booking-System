name: Booking Service CI/CD Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - 'booking-service/**'
      - 'contracts/**'
      - '.github/workflows/booking-service.yml'

  pull_request:
    branches: ["main"]
    paths:
      - 'booking-service/**'
      - 'contracts/**'
      - '.github/workflows/booking-service.yml'

  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test Booking Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Go mod tidy & download
        run: |
          cd booking-service
          go mod tidy
          go mod download

      - name: Run unit tests
        run: |
          cd booking-service
          go test ./internal/... -v -race

      - name: Build binary
        run: |
          cd booking-service
          go build -v -o service ./cmd/server

  docker:
    name: Docker Build & Push Booking Service
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/high-concurrency-ticket-booking-system-booking:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/high-concurrency-ticket-booking-system-booking:${{ github.sha }} \
            -f ./booking-service/Dockerfile .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/high-concurrency-ticket-booking-system-booking:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/high-concurrency-ticket-booking-system-booking:${{ github.sha }}