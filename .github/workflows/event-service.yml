name: Event Service CI/CD Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - 'event-service/**'
      - 'contracts/**'
      - '.github/workflows/event-service.yml'

  pull_request:
    branches: ["main"]
    paths:
      - 'event-service/**'
      - 'contracts/**'
      - '.github/workflows/event-service.yml'

  workflow_dispatch:

jobs:
    build-test:
      name: Build & Test Event Service
      runs-on: ubuntu-latest

      steps:
      # ----------------------------
      # Checkout repository
        - name: Checkout repository
          uses: actions/checkout@v4

      # ----------------------------
      # Setup Go
        - name: Setup Go
          uses: actions/setup-go@v5
          with:
            go-version: "1.26.x"

      # ----------------------------
      # Download dependencies
        - name: Go mod tidy & download
          run: |
            cd event-service
            go mod tidy
            go mod download

      # ----------------------------
      # Run unit tests
        - name: Run unit tests
          run: |
            cd event-service
            go test ./internal/... -v -race

      # ----------------------------
      # Build binary
        - name: Build binary
          run: |
            cd event-service
            go build -v -o service ./cmd/server


    docker:
      name: Docker Build & Push Event Service
      needs: build-test
      runs-on: ubuntu-latest

      steps:
      # ----------------------------
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------
      # Docker login
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----------------------------
      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/high-concurrency-ticket-booking-system-event:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/high-concurrency-ticket-booking-system-event:${{ github.sha }} \
            -f ./event-service/Dockerfile .

      # ----------------------------
      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/high-concurrency-ticket-booking-system-event:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/high-concurrency-ticket-booking-system-event:${{ github.sha }}

