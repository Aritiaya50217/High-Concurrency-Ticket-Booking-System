name: User Service CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "user-service/**"

  pull_request:
    branches: ["main"]
    paths:
      - "user-service/**"

  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/user-service

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: user-service 

    steps:
      - uses: actions/checkout@v4

      - name: Debug
        run: |
          pwd
          ls -la

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install deps
        run: go mod tidy

      - name: Run tests
        run: go test ./... -v

      - name: Build
        run: go build -o app ./cmd/server

  docker:
    needs: build-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: user-service

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        run: |
          TAG=${{ github.sha }}

          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$TAG .
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$TAG